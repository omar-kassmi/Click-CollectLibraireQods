<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit - Librairie El Qods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com.rproxy.goskope.com/css2?family=Noto+Naskh+Arabic:wght@400;500&family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="product-standalone-body">
    <header id="main-header" class="fixed top-0 left-0 right-0 z-40 transition-all duration-300 bg-transparent border-b border-transparent py-4 px-6 md:px-12">
        <div class="site-header-shell max-w-7xl mx-auto flex justify-between items-center font-header">
            <button type="button" id="mobile-menu-toggle" class="mobile-menu-toggle md:hidden" aria-expanded="false" aria-controls="mobile-menu-drawer" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
            <div class="site-logo-link flex items-center cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <img src="images/logo.png" alt="Logo" class="h-11 w-auto object-contain">
            </div>
            <nav class="hidden md:flex space-x-8 text-[14px] font-medium text-[#E75C25]">
                <button data-target="section-accueil" class="nav-tab-btn font-medium hover:opacity-80">Accueil</button>
                <button data-target="section-rentree" class="nav-tab-btn font-medium hover:opacity-80">Rentrée scolaire</button>
                <button data-target="section-autres" class="nav-tab-btn font-bold">Nos produits</button>
                <button data-target="section-suivi" class="nav-tab-btn font-medium hover:opacity-80">Suivre ma commande</button>
                <button data-target="section-plan-magasin" class="nav-tab-btn font-medium hover:opacity-80">Plan & Rayons</button>
            </nav>
            
            <div class="flex items-center space-x-3.5 text-[14px]">
                <button type="button" id="header-contact-location" onclick="switchTab('section-contact-location')" class="header-contact-location" aria-label="Coordonnées, localisation et horaires" title="Coordonnées et horaires">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.75a7.35 7.35 0 0 0-7.35 7.34c0 5.57 6.4 12.21 6.67 12.49a.95.95 0 0 0 1.36 0c.27-.28 6.67-6.92 6.67-12.49A7.35 7.35 0 0 0 12 1.75Zm0 10.56a3.22 3.22 0 1 1 0-6.44 3.22 3.22 0 0 1 0 6.44Z"></path></svg>
                </button>
                <div class="relative inline-block text-left">
                    <button id="lang-btn" class="border border-[#E75C25] text-[#E75C25] rounded-full w-9 h-9 flex items-center justify-center font-black text-xs transition hover:bg-orange-500/10 tracking-tighter font-header focus:outline-none">FR</button>
                    <div id="lang-dropdown" class="hidden absolute top-0 left-0 bg-white border border-stone-200 rounded-full flex flex-col items-center p-0.5 shadow-xl z-50 w-10 space-y-1.5 pb-1">
                        <button id="lang-opt-fr" onclick="switchLanguage('FR')" class="bg-[#E75C25] text-white rounded-full w-[34px] h-[34px] flex items-center justify-center font-black text-xs font-header focus:outline-none">FR</button>
                        <button id="lang-opt-en" onclick="switchLanguage('EN')" class="text-[#E75C25] hover:bg-orange-50 rounded-full w-[34px] h-[34px] flex items-center justify-center font-black text-xs font-header focus:outline-none">EN</button>
                        <button id="lang-opt-ar" onclick="switchLanguage('AR')" class="text-[#E75C25] hover:bg-orange-50 rounded-full w-[34px] h-[34px] flex items-center justify-center font-black text-xs font-header focus:outline-none">AR</button>
                    </div>
                </div>
                
                <button class="border border-[#E75C25] text-[#E75C25] rounded-full w-9 h-9 flex items-center justify-center transition hover:bg-orange-500/10 focus:outline-none">
                    <svg class="w-4 h-4 stroke-current fill-none stroke-[2.5]" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                
                <button onclick="switchTab('section-rentree')" class="bg-[#E75C25] hover:bg-[#CE4E1D] text-white font-medium px-5 py-2.5 rounded-lg transition text-[14px] shadow-sm">Commander</button>
            </div>
        </div>
    </header>
  <div id="mobile-menu-overlay" class="md:hidden mobile-menu-overlay" aria-hidden="true"></div>
  <aside id="mobile-menu-drawer" class="md:hidden mobile-menu-drawer" aria-hidden="true"><header><span>Navigation</span><button type="button" id="mobile-menu-close" aria-label="Fermer le menu">×</button></header><nav aria-label="Navigation mobile"><button data-target="section-accueil" class="nav-tab-btn"><span>Accueil</span><b>01</b></button><button data-target="section-rentree" class="nav-tab-btn"><span>Rentrée scolaire</span><b>02</b></button><button data-target="section-autres" class="nav-tab-btn font-bold"><span>Nos produits</span><b>03</b></button><button data-target="section-suivi" class="nav-tab-btn"><span>Suivre ma commande</span><b>04</b></button><button data-target="section-plan-magasin" class="nav-tab-btn"><span>Plan &amp; Rayons</span><b>05</b></button></nav></aside>

  <main id="product-page-root" class="product-page-root"><div class="product-page-loading">Chargement du produit…</div></main>

  <script>
    window.switchTab=function(target){location.href='index.html?tab='+encodeURIComponent(target)};
    window.switchLanguage=function(lang){const b=document.getElementById('lang-btn');if(b)b.textContent=lang;document.getElementById('lang-dropdown')?.classList.add('hidden')};
    document.getElementById('lang-btn')?.addEventListener('click',()=>document.getElementById('lang-dropdown')?.classList.toggle('hidden'));
    document.querySelectorAll('.nav-tab-btn').forEach(button=>button.addEventListener('click',()=>switchTab(button.dataset.target)));
    const toggle=document.getElementById('mobile-menu-toggle'),drawer=document.getElementById('mobile-menu-drawer'),overlay=document.getElementById('mobile-menu-overlay');
    const setMenu=open=>{drawer?.classList.toggle('is-open',open);overlay?.classList.toggle('is-open',open);toggle?.classList.toggle('is-open',open);toggle?.setAttribute('aria-expanded',open?'true':'false')};
    toggle?.addEventListener('click',()=>setMenu(toggle.getAttribute('aria-expanded')!=='true'));document.getElementById('mobile-menu-close')?.addEventListener('click',()=>setMenu(false));overlay?.addEventListener('click',()=>setMenu(false));
    const mainHeader=document.getElementById('main-header');
    function syncMainHeaderAppearance(){
      if(!mainHeader)return;
      const isScrolled=window.scrollY>40;
      mainHeader.classList.toggle('header-is-scrolled',isScrolled);
      mainHeader.classList.toggle('header-is-top',!isScrolled);
      if(isScrolled){
        mainHeader.classList.remove('bg-transparent','border-transparent','py-4');
        mainHeader.classList.add('bg-white','shadow-md','border-b','border-gray-100','py-2.5');
      }else{
        mainHeader.classList.remove('bg-white','shadow-md','border-b','border-gray-100','py-2.5');
        mainHeader.classList.add('bg-transparent','border-transparent','py-4');
      }
      if(window.matchMedia('(max-width: 767px)').matches){
        mainHeader.style.setProperty('background',isScrolled?'rgba(255,255,255,.97)':'transparent','important');
        mainHeader.style.setProperty('background-color',isScrolled?'rgba(255,255,255,.97)':'transparent','important');
        mainHeader.style.setProperty('border-bottom-color',isScrolled?'#eee5df':'transparent','important');
        mainHeader.style.setProperty('box-shadow',isScrolled?'0 8px 24px rgba(31,20,14,.08)':'none','important');
        mainHeader.style.setProperty('backdrop-filter',isScrolled?'blur(12px)':'none','important');
        mainHeader.style.setProperty('-webkit-backdrop-filter',isScrolled?'blur(12px)':'none','important');
      }
    }
    syncMainHeaderAppearance();
    window.addEventListener('load',syncMainHeaderAppearance);
    window.addEventListener('pageshow',syncMainHeaderAppearance);
    window.addEventListener('scroll',syncMainHeaderAppearance,{passive:true});
  </script>
  <script src="products.js"></script>
</body>
</html>
